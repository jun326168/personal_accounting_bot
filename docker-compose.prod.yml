# Production (VPS): nginx terminates TLS in front of the API.
# Locally, keep using docker-compose.yml + `ngrok http 8080`.
#
# Deploy (e.g. from GitHub Actions over SSH):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans
#
# Required in .env on the VPS: API_IMAGE, DOMAIN, Line__ChannelSecret, Line__ChannelAccessToken
# Certs: certbot on the host, issued to /etc/letsencrypt/live/$DOMAIN/
services:
  api:
    image: ${API_IMAGE:?set API_IMAGE, e.g. ghcr.io/<user>/personalaccountingapi:latest}
    env_file: .env
    # No published ports: only reachable by nginx on the compose network.
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    # Unprivileged variant listens on 8080/8443, so no capabilities are needed.
    image: nginxinc/nginx-unprivileged:stable-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. bot.example.com}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      - api
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
