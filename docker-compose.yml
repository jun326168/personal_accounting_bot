services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Give default limited privilege to user 
  db-user-init:
    image: postgres:17-alpine
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - ./db/create-app-user.sh:/create-app-user.sh:ro
    entrypoint: ["sh", "/create-app-user.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Create tables and business logics
  db-migrate:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_DB_USER=${APP_DB_USER}
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    entrypoint: ["sh", "/migrate.sh"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db-user-init:
        condition: service_completed_successfully

  api:
    build: .
    environment:
      - Line__ChannelSecret=${LINE_CHANNEL_SECRET}
      - Line__ChannelAccessToken=${LINE_CHANNEL_ACCESS_TOKEN}
      - DATABASE_URL=postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      db-user-init:
        condition: service_completed_successfully

volumes:
  dbdata: